    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.28.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.39
  path: ^1.9.1
  excel: ^4.0.6
  file_picker: ^10.3.10
  package_info_plus: ^8.3.1
  path_provider: ^2.1.4
  google_fonts: ^8.2.1
  flex_color_scheme: ^8.2.0
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.0+1
  syncfusion_flutter_charts: ^34.1.31
  syncfusion_flutter_core: ^34.1.31
  syncfusion_flutter_datagrid: ^34.1.31
  share_plus: ^12.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  barcode_widget: ^2.0.4
  mobile_scanner: ^7.4.0
  barcode: ^2.2.9
  connectivity_plus: ^7.3.1
  crypto: ^3.0.6
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  lottie: ^3.3.0
  local_auth: ^3.0.2
  local_auth_android: ^2.0.9
  local_auth_darwin: ^2.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.28.1
  build_runner: ^2.4.15
  sqlite3: ^2.9.4

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: assets/branding/nexabiz_app_icon.png
    background_color: "#1565C0"
    theme_color: "#1565C0"
  image_path: assets/branding/nexabiz_app_icon.png
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: assets/branding/nexabiz_app_icon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/nexabiz_app_icon.png
    - assets/animations/loading.json
    - assets/animations/barcode_scan.json
    - assets/animations/scanner_qr.json
