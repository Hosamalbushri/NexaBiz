# Experimental synchronization backend (NOT production-ready).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
      POSTGRES_DB: sync_experimental
    ports:
      - "5432:5432"
    volumes:
      - sync_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync_experimental"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sync:sync@db:5432/sync_experimental
    depends_on:
      db:
        condition: service_healthy

volumes:
  sync_pg_data:
